name: overnight
"on":
  schedule:
    - cron: "4,16,28,40,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "instant = app test run, no chain"
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: adpost
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post trade ad
        run: python cloud_bot.py
        env:
          ROLI_TOKEN: ${{ secrets.ROLI_TOKEN }}
          PLAYER_ID: ${{ secrets.PLAYER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ secrets.DATA_REPO }}
          CRON_REPO: ${{ github.repository }}
          CHAIN: ${{ github.event.inputs.mode != 'instant' }}
